<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<!-- ================================================
     PAGE CV - VERSION FRANÇAISE
     ================================================ -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - Géomaticien</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/images/logo_geomatique.png">
    
    <!-- Feuilles de styles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
    
    <!-- Script pour le thème (mémorisé) -->
    <script src="../js/main.js" defer></script>
</head>
<body>
    <!-- ================================================
         NAVIGATION (Header fixe)
         ================================================ -->
    <nav class="nav" style="display:flex; justify-content:space-between; align-items:center; padding:1rem 2rem; background:var(--menu-bg); position:fixed; top:0; left:0; right:0; z-index:100;">
        <!-- Lien retour accueil -->
        <a href="../index.html" style="color:var(--accent);">← Accueil</a>
        <!-- Liens de navigation -->
        <div style="display:flex; gap:1.5rem; flex-wrap:wrap;">
            <a href="../index.html#projects" style="color:var(--text);">Projets</a>
            <a href="../index.html#stack" style="color:var(--text);">Stack</a>
            <a href="../index.html#contact" style="color:var(--text);">Contact</a>
        </div>
    </nav>

    <!-- ================================================
         SECTION CV
         ================================================ -->
    <section class="cv-section">
        <div class="cv-container">
            <!-- Logo -->
            <img src="../assets/images/logo_geomatique.png" alt="Logo" style="width:80px; margin:0 auto 1.5rem; filter:drop-shadow(0 0 12px #58a6ff88);">
            <!-- Titre -->
            <h1 class="cv-title">Mon CV</h1>
            <!-- Sous-titre -->
            <p class="cv-subtitle">Choisissez la version de votre choix</p>

            <!-- Cartes de téléchargement -->
            <div class="cv-cards">
                <!-- Carte CV Français -->
                <a href="../assets/cv/CV-fr.pdf" target="_blank" class="cv-card">
                    <div class="cv-flag">🇫🇷</div>
                    <h2>Version Française</h2>
                    <p>CV complet en français</p>
                    <span class="cv-btn">Télécharger PDF</span>
                </a>
                <!-- Carte CV Anglais -->
                <a href="../assets/cv/CV-en.pdf" target="_blank" class="cv-card">
                    <div class="cv-flag">🇬🇧</div>
                    <h2>English Version</h2>
                    <p>Full CV in English</p>
                    <span class="cv-btn">Download PDF</span>
                </a>
            </div>
        </div>
    </section>
</body>
</html>
