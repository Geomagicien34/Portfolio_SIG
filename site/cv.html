<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - Géomaticien</title>
    <link rel="icon" type="image/png" href="../assets/images/logo_geomatique.png">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background:#0d1117;">

    <nav class="nav" style="display:flex; justify-content:space-between; align-items:center; padding:1rem 2rem; background:rgba(10,15,40,0.97); position:fixed; top:0; left:0; right:0; z-index:100;">
        <a href="../index.html" style="color:#58a6ff;">← Accueil</a>
        <div style="display:flex; gap:1.5rem; flex-wrap:wrap;">
            <a href="../index.html#projects" style="color:#c9d1d9;">Projets</a>

            <a href="../index.html#contact" style="color:#c9d1d9;">Contact</a>
        </div>

    <section class="cv-section">
        <div class="cv-container">
            <img src="../assets/images/logo_geomatique.png" alt="Logo" style="width:80px; margin:0 auto 1.5rem; filter:drop-shadow(0 0 12px #58a6ff88);">
            <h1 class="cv-title">Mon CV</h1>
            <p class="cv-subtitle">Choisissez la version de votre choix</p>

            <div class="cv-cards">

                    <span class="cv-btn">Télécharger PDF</span>

                <a href="../assets/cv/CV-en.pdf" target="_blank" class="cv-card">
                    <div class="cv-flag">🇬🇧</div>
                    <h2>English Version</h2>
                    <p>Full CV in English</p>
                    <span class="cv-btn">Download PDF</span>
                </a>
