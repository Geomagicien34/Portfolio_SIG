<!DOCTYPE html>
<html lang="en" data-theme="dark">
<!-- ================================================
     CV PAGE - ENGLISH VERSION
     ================================================ -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - Geomatician</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../../assets/images/logo_geomatique.png">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/animations.css">
    
    <!-- Script for theme (remembered) -->
    <script src="../../js/main.js" defer></script>
</head>
<body>
    <!-- ================================================
         NAVIGATION (Fixed header)
         ================================================ -->
    <nav class="nav" style="display:flex; justify-content:space-between; align-items:center; padding:1rem 2rem; background:rgba(10,15,40,0.97); position:fixed; top:0; left:0; right:0; z-index:100;">
        <!-- Home link -->
        <a href="index.html" style="color:#58a6ff;">← Home</a>
        <!-- Navigation links -->
        <div style="display:flex; gap:1.5rem; flex-wrap:wrap;">
            <a href="index.html#projects" style="color:#c9d1d9;">Projects</a>
            <a href="index.html#stack" style="color:#c9d1d9;">Stack</a>
            <a href="index.html#contact" style="color:#c9d1d9;">Contact</a>
        </div>
    </nav>

    <!-- ================================================
         CV SECTION
         ================================================ -->
    <section class="cv-section">
        <div class="cv-container">
            <!-- Logo -->
            <img src="../../assets/images/logo_geomatique.png" alt="Logo" style="width:80px; margin:0 auto 1.5rem; filter:drop-shadow(0 0 12px #58a6ff88);">
            <!-- Title -->
            <h1 class="cv-title">My CV</h1>
            <!-- Subtitle -->
            <p class="cv-subtitle">Choose your preferred version</p>

            <!-- Download cards -->
            <div class="cv-cards">
                <!-- French CV Card -->
                <a href="../../assets/cv/CV-fr.pdf" target="_blank" class="cv-card">
                    <div class="cv-flag">🇫🇷</div>
                    <h2>Version Française</h2>
                    <p>CV complet en français</p>
                    <span class="cv-btn">Télécharger PDF</span>
                </a>
                <!-- English CV Card -->
                <a href="../../assets/cv/CV-en.pdf" target="_blank" class="cv-card">
                    <div class="cv-flag">🇬🇧</div>
                    <h2>English Version</h2>
                    <p>Full CV in English</p>
                    <span class="cv-btn">Download PDF</span>
                </a>
            </div>
        </div>
    </section>
</body>
</html>
